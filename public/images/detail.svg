<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Demo close-up packaging shot: macro detail of the brushed metal pump and textured label edge">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F7EFE6"/>
      <stop offset="60%" stop-color="#EADCCB"/>
      <stop offset="100%" stop-color="#D9C4AE"/>
    </linearGradient>
    <linearGradient id="metald" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#9C948B"/>
      <stop offset="14%" stop-color="#E9E4DD"/>
      <stop offset="34%" stop-color="#B8B1A8"/>
      <stop offset="52%" stop-color="#F4F1EC"/>
      <stop offset="72%" stop-color="#AFA8A0"/>
      <stop offset="100%" stop-color="#8E877F"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#FBF5EE"/>
      <stop offset="55%" stop-color="#F1E4D5"/>
      <stop offset="100%" stop-color="#E2D0BD"/>
    </linearGradient>
    <filter id="d1"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="d2"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="grainD">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgd)"/>
  <ellipse cx="330" cy="240" rx="420" ry="300" fill="#FFFCF8" opacity="0.55" filter="url(#d1)"/>

  <!-- blurred bottle shoulder in the background -->
  <g filter="url(#d2)" opacity="0.75">
    <path d="M700 800 L700 420 C700 330 780 280 880 268 L1000 268 C1100 280 1180 330 1180 420 L1180 800 Z" fill="#D8B296"/>
  </g>

  <!-- pump macro -->
  <g transform="translate(120 120)">
    <rect x="0" y="0" width="360" height="150" rx="52" fill="url(#metald)"/>
    <rect x="0" y="0" width="360" height="46" rx="23" fill="#FFFFFF" opacity="0.4"/>
    <rect x="0" y="104" width="360" height="12" rx="6" fill="#7E766E" opacity="0.35"/>
    <!-- knurled ridges on the collar -->
    <g opacity="0.5">
      <rect x="12" y="40" width="4" height="60" rx="2" fill="#8B837A"/>
      <rect x="36" y="40" width="4" height="60" rx="2" fill="#8B837A"/>
      <rect x="60" y="40" width="4" height="60" rx="2" fill="#8B837A"/>
      <rect x="84" y="40" width="4" height="60" rx="2" fill="#8B837A"/>
      <rect x="272" y="40" width="4" height="60" rx="2" fill="#8B837A"/>
      <rect x="296" y="40" width="4" height="60" rx="2" fill="#8B837A"/>
      <rect x="320" y="40" width="4" height="60" rx="2" fill="#8B837A"/>
    </g>
    <!-- nozzle -->
    <path d="M-96 46 L6 46 L6 104 L-96 104 Q-124 104 -124 75 Q-124 46 -96 46 Z" fill="url(#metald)"/>
    <ellipse cx="-104" cy="75" rx="16" ry="30" fill="#6F6860" opacity="0.55"/>
  </g>

  <!-- label edge macro -->
  <g transform="translate(430 330)">
    <path d="M0 0 L330 -34 L330 430 L0 464 Z" fill="url(#paper)"/>
    <path d="M0 0 L330 -34 L330 430 L0 464 Z" fill="none" stroke="#D6C2AC" stroke-width="1.2"/>
    <!-- debossed arc catching raking light -->
    <path d="M40 176 C 118 92 226 84 300 150" fill="none" stroke="#C9B49C" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M40 182 C 118 98 226 90 300 156" fill="none" stroke="#FFFDFA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- letterpress wordmark -->
    <text x="160" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="46" letter-spacing="6" fill="#5A5148" transform="rotate(-6 160 272)">NUVELLA</text>
    <text x="160" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="46" letter-spacing="6" fill="#FFFFFF" opacity="0.35" transform="rotate(-6 159 271)">NUVELLA</text>
    <text x="160" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#7A6F64" transform="rotate(-6 160 312)">DAILY COMFORT BABY LOTION</text>
    <!-- paper fibre texture -->
    <rect x="0" y="0" width="330" height="464" fill="#B9A58E" opacity="0.08" filter="url(#grainD)"/>
  </g>

  <text x="600" y="756" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#7A6F64" opacity="0.85">PACKAGING DETAIL — DEMO VISUAL</text>
</svg>
