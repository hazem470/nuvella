<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="Demo side product shot: three-quarter rear angle of the Nuvella bottle showing the pump profile and sage base band">
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FCF8F4"/>
      <stop offset="100%" stop-color="#EFE4D8"/>
    </linearGradient>
    <linearGradient id="bodys" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBA084"/>
      <stop offset="26%" stop-color="#E4C4AE"/>
      <stop offset="58%" stop-color="#F0DBCB"/>
      <stop offset="100%" stop-color="#BE9277"/>
    </linearGradient>
    <linearGradient id="metals" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ADA69D"/>
      <stop offset="30%" stop-color="#E4DFD8"/>
      <stop offset="70%" stop-color="#C7C0B7"/>
      <stop offset="100%" stop-color="#A69F96"/>
    </linearGradient>
    <filter id="s3"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="s4"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="900" height="900" fill="url(#bgs)"/>
  <path d="M60 640 C 280 420 620 420 840 640" fill="none" stroke="#7E9A78" stroke-opacity="0.14" stroke-width="2"/>

  <ellipse cx="450" cy="744" rx="196" ry="26" fill="#C9A88F" opacity="0.3" filter="url(#s4)"/>
  <ellipse cx="470" cy="744" rx="88" ry="13" fill="#8C6A55" opacity="0.26" filter="url(#s3)"/>

  <!-- three-quarter rotation via a skewed group -->
  <g transform="translate(150 62) skewY(-2)">
    <!-- pump nozzle pointing away/right -->
    <path d="M352 176 L388 176 L388 202 L352 202 Q341 202 341 189 Q341 176 352 176 Z" fill="url(#metals)"/>
    <rect x="336" y="160" width="104" height="46" rx="21" fill="url(#metals)"/>
    <rect x="336" y="160" width="104" height="15" rx="7" fill="#FFFFFF" opacity="0.3"/>
    <rect x="372" y="202" width="34" height="44" rx="9" fill="#BEB7AE"/>
    <rect x="350" y="240" width="78" height="58" rx="14" fill="url(#metals)"/>
    <rect x="350" y="256" width="78" height="3" fill="#8F887F" opacity="0.45"/>
    <rect x="350" y="280" width="78" height="3" fill="#8F887F" opacity="0.3"/>

    <path d="M358 296 L358 290 L420 290 L420 296
             C 468 312 508 354 508 424
             L 508 826
             C 508 862 478 888 442 888
             L 336 888
             C 300 888 270 862 270 826
             L 270 424
             C 270 354 310 312 358 296 Z"
          fill="url(#bodys)"/>
    <!-- label seen at an angle: foreshortened -->
    <path d="M286 470 L494 452 L494 760 L286 776 Z" fill="#F7EFE6"/>
    <path d="M286 470 L494 452 L494 760 L286 776 Z" fill="none" stroke="#DCCBB8"/>
    <path d="M286 744 L494 730 L494 748 C494 758 486 766 474 766 L300 778 C290 778 286 772 286 764 Z" fill="#7E9A78" opacity="0.92"/>
    <!-- wordmark, compressed by the perspective -->
    <text x="390" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="3.4" fill="#3A342E" transform="rotate(-4.6 390 600)">NUVELLA</text>
    <text x="390" y="628" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#6B6157" transform="rotate(-4.6 390 628)">DAILY COMFORT</text>
    <text x="390" y="700" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="2.6" fill="#8C8177" transform="rotate(-4.6 390 700)">250 ml · 8.5 fl oz</text>
    <!-- edge highlight -->
    <path d="M292 452 L292 810 C292 838 310 858 338 862" fill="none" stroke="#FFF7EF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
    <path d="M488 442 L488 806" fill="none" stroke="#A97F67" stroke-opacity="0.3" stroke-width="12" stroke-linecap="round"/>
  </g>

  <text x="450" y="866" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2.8" fill="#8C8177" opacity="0.85">SIDE / REAR ANGLE — DEMO VISUAL</text>
</svg>
